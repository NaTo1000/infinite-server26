version: '3.8'

services:
  # Infinite Server26 - Main Fortress Container
  fortress:
    image: nato1000/infinite-server26:latest
    container_name: infinite-fortress
    privileged: true
    restart: unless-stopped
    environment:
      - INFINITE_VERSION=26.1
      - NAYDOE_MODE=autonomous
      - JESSICAI_MODE=huntress
      - NAI_GAIL_ENABLED=true
      - NIA_VAULT_ACTIVE=true
      - SECURITY_LEVEL=maximum
      - MERCY_MODE=disabled
    volumes:
      - fortress-data:/root/fortress
      - vault-storage:/opt/nia-vault/storage
      - logs:/var/log
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
      - "8443:8443"
      - "6443:6443"
      - "2376:2376"
      - "2377:2377"
      - "5000:5000"
      - "8000:8000"
      - "9000:9000"
    networks:
      - fortress-network
    depends_on:
      blockchain-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --retry 3 --retry-delay 10 --fail http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Rancher - Container Management Dashboard
  rancher:
    image: rancher/rancher:latest
    container_name: rancher-dashboard
    restart: unless-stopped
    privileged: true
    ports:
      - "8090:80"
      - "8444:443"
    volumes:
      - rancher-data:/var/lib/rancher
    networks:
      - fortress-network
    environment:
      - CATTLE_BOOTSTRAP_PASSWORD=${RANCHER_PASSWORD:-admin}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════════════════
  # BLOCKCHAIN NODE - Hyperledger Fabric Peer for Immutable Audit Logs
  # ═══════════════════════════════════════════════════════════════════
  blockchain-node:
    image: hyperledger/fabric-peer:2.5
    container_name: blockchain-peer
    restart: unless-stopped
    environment:
      # Peer identity – use a DNS-style peer ID, not the MSP name
      - CORE_PEER_ID=peer0.org1.example.com
      - CORE_PEER_ADDRESS=0.0.0.0:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=blockchain-peer:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=blockchain-peer:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=blockchain-peer:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      # Must match the Docker network name (see networks.fortress-network.name)
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=infinite-network
      - FABRIC_LOGGING_SPEC=INFO
      # TLS disabled for development; enable and mount certs for production
      - CORE_PEER_TLS_ENABLED=false
      - CORE_LEDGER_STATE_STATEDATABASE=goleveldb
    ports:
      - "7051:7051"
      - "7052:7052"
    volumes:
      # Crypto materials directory: requires MSP certs, admin certs, and TLS certs
      # generated by Hyperledger Fabric cryptogen or Fabric CA.
      # Expected structure: ./crypto/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/
      - ./crypto:/etc/hyperledger/crypto
      - ./logs-ledger:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock
    networks:
      - fortress-network
    healthcheck:
      test: ["CMD-SHELL", "peer node status 2>/dev/null | grep -q 'STARTED' || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fortress-data:
    driver: local
  vault-storage:
    driver: local
  logs:
    driver: local
  rancher-data:
    driver: local

networks:
  fortress-network:
    name: infinite-network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.100.0/24
          gateway: 192.168.100.1
