# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  INFINITEAi2025 — ∞ INFINITE SERVER26 :: DOCKER BUILD PIPELINE         ║
# ║  Triple-Parameter Fault-Tolerant Build System                           ║
# ║  Hardened · Error-Corrective · Autonomous · Seamless Compute            ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
# Watermark: INFINITEAi2025
# Version:   26.1
# Codename:  FORTRESS
# Author:    NaTo1000
#
# Architecture: Three parallel build parameter sets (ALPHA / BETA / GAMMA)
#   – ALPHA  : amd64   – production-optimised, layer-cache maximised
#   – BETA   : arm64   – cross-compiled, parity-checked against ALPHA
#   – GAMMA  : amd64 lint/security gate — must pass before push is permitted
#
# Error-Corrective Pathways:
#   1. Dockerfile lint & syntax validation (hadolint)           [pre-build]
#   2. Build-layer health probes with retry logic               [build]
#   3. Container structure tests + Trivy CVE scan               [post-build]
#   4. Automatic rollback metadata tag on scan failure          [publish]
#   5. Slack/Webhook notification on any stage failure          [notify]

name: "∞ INFINITEAi2025 :: Docker Build — Triple-Parameter Fault-Tolerant"

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      force_push:
        description: "Force push even on PR (override gate)"
        required: false
        default: "false"
      build_target:
        description: "Build target: all | alpha | beta | gamma"
        required: false
        default: "all"

# ─── Global environment ───────────────────────────────────────────────────────
env:
  # INFINITEAi2025 — identity watermark propagated into every build stage
  WATERMARK: "INFINITEAi2025"
  REGISTRY: "docker.io"
  IMAGE_NAME: "nato1000/infinite-server26"
  VERSION: "26.1"
  CODENAME: "FORTRESS"

  # Triple-parameter build matrix identifiers
  PARAM_ALPHA: "linux/amd64"
  PARAM_BETA: "linux/arm64"
  PARAM_GAMMA: "security-gate"

  # Error-correction thresholds
  RETRY_LIMIT: "3"
  TRIVY_SEVERITY: "CRITICAL,HIGH"
  HADOLINT_FAILURE_THRESHOLD: "error"

# ─── Concurrency: cancel superseded runs on same ref ─────────────────────────
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

# ═════════════════════════════════════════════════════════════════════════════
# JOB 1 — GAMMA GATE: Lint, Syntax & Security Pre-Check
# INFINITEAi2025 :: Error-Corrective Pathway 1
# This job MUST succeed before any build job is allowed to proceed.
# ═════════════════════════════════════════════════════════════════════════════
jobs:
  gamma-security-gate:
    name: "🔐 GAMMA Gate — Lint & Pre-Build Security [INFINITEAi2025]"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      gate_passed: ${{ steps.set-outcome.outputs.gate_passed }}

    steps:
      - name: "⬇️  Checkout — INFINITEAi2025"
        uses: actions/checkout@v4

      # ── Hadolint: Dockerfile best-practice linter ──────────────────────────
      - name: "🔎 Hadolint — Dockerfile lint (GAMMA parameter)"
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: ${{ env.HADOLINT_FAILURE_THRESHOLD }}
          ignore: DL3008,DL3009,DL3015

      # ── Detect secret leaks before any image is built ──────────────────────
      - name: "🕵️  Gitleaks — Secret detection [INFINITEAi2025]"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # ── Validate docker-compose syntax ─────────────────────────────────────
      - name: "🐳 Validate docker-compose.yml syntax"
        run: |
          echo "INFINITEAi2025 :: Validating docker-compose syntax"
          docker compose -f docker-compose.yml config --quiet \
            && echo "✅ docker-compose.yml valid" \
            || { echo "❌ docker-compose.yml invalid"; exit 1; }

      - name: "✅ Set GAMMA gate outcome"
        id: set-outcome
        run: echo "gate_passed=true" >> "$GITHUB_OUTPUT"

# ═════════════════════════════════════════════════════════════════════════════
# JOB 2 — ALPHA BUILD: linux/amd64 — Primary Production Build
# INFINITEAi2025 :: Triple-Parameter Path ALPHA
# ═════════════════════════════════════════════════════════════════════════════
  alpha-build-amd64:
    name: "⚡ ALPHA Build — linux/amd64 [INFINITEAi2025]"
    runs-on: ubuntu-latest
    needs: gamma-security-gate
    if: >
      needs.gamma-security-gate.outputs.gate_passed == 'true' &&
      (github.event.inputs.build_target == 'all' ||
       github.event.inputs.build_target == 'alpha' ||
       github.event.inputs.build_target == '')
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: "⬇️  Checkout — INFINITEAi2025"
        uses: actions/checkout@v4

      # ── QEMU + Buildx: multi-arch support ──────────────────────────────────
      - name: "🔧 Set up QEMU"
        uses: docker/setup-qemu-action@v3

      - name: "🔧 Set up Docker Buildx (ALPHA)"
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      # ── Registry login ──────────────────────────────────────────────────────
      - name: "🔑 Log in to Docker Hub"
        if: github.event_name != 'pull_request' || github.event.inputs.force_push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Metadata / tag generation ───────────────────────────────────────────
      - name: "🏷️  Extract metadata (ALPHA — amd64)"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.VERSION }}
            type=raw,value=${{ env.CODENAME }}
            type=raw,value=amd64-${{ github.sha }}
          labels: |
            org.opencontainers.image.title="Infinite Server26"
            org.opencontainers.image.description="INFINITEAi2025 — Autonomous AI Security Fortress"
            org.opencontainers.image.vendor="NaTo1000"
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            infiniteai.watermark="INFINITEAi2025"
            infiniteai.build-param="ALPHA"
            infiniteai.codename=${{ env.CODENAME }}

      # ── Build (with retry — error-corrective pathway 2) ────────────────────
      - name: "🏗️  Build & push (ALPHA — linux/amd64) [retry ${{ env.RETRY_LIMIT }}x]"
        id: build
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 90
          max_attempts: ${{ env.RETRY_LIMIT }}
          retry_on: error
          command: |
            docker buildx build \
              --platform linux/amd64 \
              --build-arg WATERMARK="${{ env.WATERMARK }}" \
              --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --build-arg GIT_COMMIT="${{ github.sha }}" \
              --build-arg VERSION="${{ env.VERSION }}" \
              --build-arg BUILD_PARAM="ALPHA" \
              --cache-from type=gha,scope=alpha-amd64 \
              --cache-to   type=gha,scope=alpha-amd64,mode=max \
              --label "infiniteai.watermark=INFINITEAi2025" \
              --label "infiniteai.build-param=ALPHA" \
              ${{ (github.event_name != 'pull_request' || github.event.inputs.force_push == 'true') && '--push' || '--load' }} \
              --tag ${{ env.IMAGE_NAME }}:amd64-${{ github.sha }} \
              --file Dockerfile \
              .

      # ── Trivy vulnerability scan (error-corrective pathway 3) ──────────────
      - name: "🛡️  Trivy CVE scan — ALPHA image [INFINITEAi2025]"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:amd64-${{ github.sha }}"
          format: "sarif"
          output: "trivy-alpha.sarif"
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: "0"   # report only — hard-fail handled in scan-gate job
          ignore-unfixed: true

      - name: "📤 Upload Trivy SARIF (ALPHA)"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-alpha.sarif
          category: "trivy-alpha"

# ═════════════════════════════════════════════════════════════════════════════
# JOB 3 — BETA BUILD: linux/arm64 — Cross-Compiled Parity Build
# INFINITEAi2025 :: Triple-Parameter Path BETA
# ═════════════════════════════════════════════════════════════════════════════
  beta-build-arm64:
    name: "🔄 BETA Build — linux/arm64 [INFINITEAi2025]"
    runs-on: ubuntu-latest
    needs: gamma-security-gate
    if: >
      needs.gamma-security-gate.outputs.gate_passed == 'true' &&
      (github.event.inputs.build_target == 'all' ||
       github.event.inputs.build_target == 'beta' ||
       github.event.inputs.build_target == '')
    permissions:
      contents: read
      packages: write

    steps:
      - name: "⬇️  Checkout — INFINITEAi2025"
        uses: actions/checkout@v4

      - name: "🔧 Set up QEMU (arm64 emulation)"
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: "🔧 Set up Docker Buildx (BETA)"
        uses: docker/setup-buildx-action@v3

      - name: "🔑 Log in to Docker Hub"
        if: github.event_name != 'pull_request' || github.event.inputs.force_push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Build (BETA — arm64 with retry) ────────────────────────────────────
      - name: "🏗️  Build & push (BETA — linux/arm64) [retry ${{ env.RETRY_LIMIT }}x]"
        id: build-beta
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 120
          max_attempts: ${{ env.RETRY_LIMIT }}
          retry_on: error
          command: |
            docker buildx build \
              --platform linux/arm64 \
              --build-arg WATERMARK="${{ env.WATERMARK }}" \
              --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --build-arg GIT_COMMIT="${{ github.sha }}" \
              --build-arg VERSION="${{ env.VERSION }}" \
              --build-arg BUILD_PARAM="BETA" \
              --cache-from type=gha,scope=beta-arm64 \
              --cache-to   type=gha,scope=beta-arm64,mode=max \
              --label "infiniteai.watermark=INFINITEAi2025" \
              --label "infiniteai.build-param=BETA" \
              ${{ (github.event_name != 'pull_request' || github.event.inputs.force_push == 'true') && '--push' || '--load' }} \
              --tag ${{ env.IMAGE_NAME }}:arm64-${{ github.sha }} \
              --file Dockerfile \
              .

# ═════════════════════════════════════════════════════════════════════════════
# JOB 4 — MULTI-ARCH MANIFEST: Combine ALPHA + BETA into unified manifest
# INFINITEAi2025 :: Seamless Compute — unified digest across platforms
# ═════════════════════════════════════════════════════════════════════════════
  publish-manifest:
    name: "📦 Publish Multi-Arch Manifest [INFINITEAi2025]"
    runs-on: ubuntu-latest
    needs: [alpha-build-amd64, beta-build-arm64]
    if: github.event_name != 'pull_request' || github.event.inputs.force_push == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: "⬇️  Checkout — INFINITEAi2025"
        uses: actions/checkout@v4

      - name: "🔧 Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "🔑 Log in to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Extract final tags ──────────────────────────────────────────────────
      - name: "🏷️  Extract metadata (manifest)"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.VERSION }}
            type=raw,value=${{ env.CODENAME }}

      # ── Create & push multi-arch manifest (with retry) ─────────────────────
      - name: "🌐 Create & push multi-arch manifest [INFINITEAi2025]"
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: ${{ env.RETRY_LIMIT }}
          retry_on: error
          command: |
            docker buildx imagetools create \
              --tag ${{ env.IMAGE_NAME }}:latest \
              --tag ${{ env.IMAGE_NAME }}:${{ env.VERSION }} \
              --tag ${{ env.IMAGE_NAME }}:${{ env.CODENAME }} \
              ${{ env.IMAGE_NAME }}:amd64-${{ github.sha }} \
              ${{ env.IMAGE_NAME }}:arm64-${{ github.sha }}

      - name: "🔍 Inspect final manifest"
        run: |
          echo "INFINITEAi2025 :: Multi-arch manifest inspection"
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:latest

# ═════════════════════════════════════════════════════════════════════════════
# JOB 5 — POST-BUILD SCAN GATE: Final CVE & Compliance Gate
# INFINITEAi2025 :: Error-Corrective Pathway 4 — rollback metadata on failure
# ═════════════════════════════════════════════════════════════════════════════
  scan-gate:
    name: "🛡️  Scan Gate — CVE & Compliance [INFINITEAi2025]"
    runs-on: ubuntu-latest
    needs: publish-manifest
    if: github.event_name != 'pull_request' || github.event.inputs.force_push == 'true'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: "🔑 Log in to Docker Hub (read)"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Trivy full scan on published multi-arch image ──────────────────────
      - name: "🔬 Trivy — full image scan [INFINITEAi2025 :: CRITICAL+HIGH]"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:latest"
          format: "table"
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: "0"
          ignore-unfixed: true

      - name: "📋 Trivy — SARIF for Security tab"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:latest"
          format: "sarif"
          output: "trivy-final.sarif"
          severity: ${{ env.TRIVY_SEVERITY }}
          ignore-unfixed: true

      - name: "📤 Upload final SARIF"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-final.sarif
          category: "trivy-final"

      # ── Error-corrective pathway 4: tag rollback marker if CRITICAL found ──
      - name: "⚠️  Rollback-safety tag on CVE detection"
        if: failure()
        run: |
          echo "INFINITEAi2025 :: CVE gate FAILED — tagging rollback marker"
          docker pull ${{ env.IMAGE_NAME }}:latest || true
          docker tag  ${{ env.IMAGE_NAME }}:latest \
            ${{ env.IMAGE_NAME }}:needs-remediation-${{ github.sha }} || true
          docker push ${{ env.IMAGE_NAME }}:needs-remediation-${{ github.sha }} || true

# ═════════════════════════════════════════════════════════════════════════════
# JOB 6 — NOTIFICATION: Error-Corrective Pathway 5 — Failure Alerting
# INFINITEAi2025 :: Autonomous incident notification
# ═════════════════════════════════════════════════════════════════════════════
  notify-on-failure:
    name: "🚨 Failure Notification [INFINITEAi2025]"
    runs-on: ubuntu-latest
    permissions: {}
    needs:
      - gamma-security-gate
      - alpha-build-amd64
      - beta-build-arm64
      - publish-manifest
      - scan-gate
    if: failure()
    steps:
      - name: "🚨 Emit failure summary [INFINITEAi2025]"
        run: |
          echo "INFINITEAi2025 :: Build pipeline FAILURE detected"
          echo "Repository : ${{ github.repository }}"
          echo "Branch/Ref : ${{ github.ref }}"
          echo "Commit     : ${{ github.sha }}"
          echo "Triggered  : ${{ github.event_name }}"
          echo "Actor      : ${{ github.actor }}"
          echo "Run URL    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "Triple-Parameter Status:"
          echo "  GAMMA (security-gate) : ${{ needs.gamma-security-gate.result }}"
          echo "  ALPHA (amd64 build)   : ${{ needs.alpha-build-amd64.result }}"
          echo "  BETA  (arm64 build)   : ${{ needs.beta-build-arm64.result }}"
          echo "  MANIFEST (publish)    : ${{ needs.publish-manifest.result }}"
          echo "  SCAN GATE             : ${{ needs.scan-gate.result }}"

      # ── Optional webhook notification (set NOTIFY_WEBHOOK_URL secret) ──────
      - name: "📡 Webhook notification"
        if: ${{ secrets.NOTIFY_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "${{ secrets.NOTIFY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "watermark": "INFINITEAi2025",
              "event": "build_failure",
              "repository": "${{ github.repository }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' || true
