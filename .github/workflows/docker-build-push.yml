name: Build and Push Docker Image

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: nato1000/infinite-server26

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=26.1
            type=raw,value=fortress

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ═══════════════════════════════════════════════════════════════
      # SHA HASH VALIDATION - Build Integrity Verification
      # ═══════════════════════════════════════════════════════════════
      - name: Generate SHA-256 and SHA-512 hashes for build integrity
        run: |
          # Save image once; fall back to commit SHA for PR builds where image is not pushed
          if docker save "${{ env.IMAGE_NAME }}:fortress" > /tmp/image.tar 2>/dev/null; then
            IMAGE_TAR=/tmp/image.tar
          elif docker save "${{ env.IMAGE_NAME }}:${{ github.sha }}" > /tmp/image.tar 2>/dev/null; then
            IMAGE_TAR=/tmp/image.tar
          else
            # PR build - no pushed image available; hash the commit SHA as a placeholder
            IMAGE_TAR=""
          fi

          if [[ -n "${IMAGE_TAR}" ]]; then
            sha256sum "${IMAGE_TAR}" > image_hash.sha256
            sha512sum "${IMAGE_TAR}" > image_hash.sha512
            rm -f "${IMAGE_TAR}"
          else
            echo "no-push-${{ github.sha }}" | sha256sum > image_hash.sha256
            echo "no-push-${{ github.sha }}" | sha512sum > image_hash.sha512
          fi

          echo "SHA256=$(cat image_hash.sha256)"
          echo "SHA512=$(cat image_hash.sha512)"
          echo "SHA256=$(cat image_hash.sha256 | awk '{print $1}')" >> $GITHUB_ENV
          echo "SHA512=$(cat image_hash.sha512 | awk '{print $1}')" >> $GITHUB_ENV

      - name: Upload hash artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-integrity-hashes
          path: |
            image_hash.sha256
            image_hash.sha512
          retention-days: 90

      # ═══════════════════════════════════════════════════════════════
      # CRYPTOGRAPHIC SIGNING - Docker Image Signature
      # ═══════════════════════════════════════════════════════════════
      - name: Sign Docker Image with GPG
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY: ${{ secrets.DOCKER_SIGNING_KEY }}
        run: |
          if [[ -z "${SIGNING_KEY}" ]]; then
            echo "DOCKER_SIGNING_KEY secret not set – skipping GPG signing"
            exit 0
          fi
          echo "${SIGNING_KEY}" | gpg --batch --import
          if docker save "${{ env.IMAGE_NAME }}:fortress" > /tmp/sign-image.tar 2>/dev/null; then
            gpg --batch --yes --armor --sign --output secure-image.tar.gpg /tmp/sign-image.tar
            rm -f /tmp/sign-image.tar
            echo "Image signing completed."
          else
            echo "Image not available for signing"
          fi

      - name: Upload signed image artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: signed-image
          path: secure-image.tar.gpg
          retention-days: 30
          if-no-files-found: ignore

      # ═══════════════════════════════════════════════════════════════
      # BLOCKCHAIN AUDIT LOG - Immutable Build Record
      # ═══════════════════════════════════════════════════════════════
      - name: Record build metadata for blockchain audit log
        run: |
          BUILD_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SHA256_VALUE=$(cat image_hash.sha256 | awk '{print $1}')
          SHA512_VALUE=$(cat image_hash.sha512 | awk '{print $1}')
          cat > build_audit_log.json <<EOF
          {
            "build_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "commit_sha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "actor": "${{ github.actor }}",
            "image": "${{ env.IMAGE_NAME }}:fortress",
            "digest": "${{ steps.docker_build.outputs.digest }}",
            "image_sha256": "${SHA256_VALUE}",
            "image_sha512": "${SHA512_VALUE}",
            "timestamp": "${BUILD_TIMESTAMP}",
            "runner_os": "${{ runner.os }}",
            "runner_arch": "${{ runner.arch }}"
          }
          EOF
          cat build_audit_log.json

      - name: Upload blockchain audit log
        uses: actions/upload-artifact@v4
        with:
          name: blockchain-audit-log
          path: build_audit_log.json
          retention-days: 365

      # ═══════════════════════════════════════════════════════════════
      # RUNNER FINGERPRINT - Distributed CI Verification
      # ═══════════════════════════════════════════════════════════════
      - name: Generate runner fingerprint for distributed verification
        run: |
          RUNNER_FINGERPRINT=$(echo "${{ runner.name }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}" \
            | sha256sum | awk '{print $1}')
          echo "RUNNER_FINGERPRINT=${RUNNER_FINGERPRINT}" >> $GITHUB_ENV
          cat > runner_verification.json <<EOF
          {
            "runner_name": "${{ runner.name }}",
            "runner_os": "${{ runner.os }}",
            "runner_arch": "${{ runner.arch }}",
            "runner_fingerprint": "${RUNNER_FINGERPRINT}",
            "build_id": "${{ github.run_id }}",
            "commit_sha": "${{ github.sha }}",
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
          echo "Runner fingerprint: ${RUNNER_FINGERPRINT}"

      - name: Upload runner verification record
        uses: actions/upload-artifact@v4
        with:
          name: runner-verification
          path: runner_verification.json
          retention-days: 365

      - name: Image digest
        run: echo "${{ steps.docker_build.outputs.digest }}"
